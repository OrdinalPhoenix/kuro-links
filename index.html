<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="color-scheme" content="dark">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KURO' — Links</title>
	<meta name="description"
		content="KURO / photoKURO' — Generative Art, BSV Ordinals, Podcasts. All links in one place.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"
		rel="stylesheet">
	<style>
		:root {
			--bg: #000;
			--panel: #0e0e12;
			--line: #1e1e26;
			--txt: #ececec;
			--muted: #8a8a95;
			--cyan: #00e5ff;
			--magenta: #ff2d78;
			--radius: 14px;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		html {
			-webkit-text-size-adjust: 100%
		}

		body {
			background: var(--bg);
			color: var(--txt);
			font-family: 'Space Grotesk', 'Zen Kaku Gothic New', system-ui, sans-serif;
			min-height: 100dvh;
			line-height: 1.5;
		}

		html {
			background: #000
		}

		#space {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			display: block;
			background: #000;
		}

		.wrap {
			position: relative;
			z-index: 1;
			max-width: 680px;
			margin: 0 auto;
			padding: clamp(28px, 6vw, 56px) clamp(18px, 5vw, 28px) 64px;
		}

		/* ---------- header ---------- */
		header {
			margin-bottom: clamp(28px, 6vw, 44px)
		}

		.glitch {
			font-weight: 700;
			font-size: clamp(44px, 12vw, 72px);
			letter-spacing: .06em;
			line-height: 1;
			position: relative;
			display: inline-block;
			user-select: none;
		}

		.glitch::before,
		.glitch::after {
			content: attr(data-text);
			position: absolute;
			inset: 0;
			opacity: .85;
			mix-blend-mode: screen;
			will-change: transform, clip-path;
		}

		.glitch::before {
			color: var(--cyan);
			transform: translate(var(--g1x, -1.5px), var(--g1y, 0));
			clip-path: var(--g1c, none);
		}

		.glitch::after {
			color: var(--magenta);
			transform: translate(var(--g2x, 1.5px), var(--g2y, 0));
			clip-path: var(--g2c, none);
		}

		.glitch.burst {
			transform: skewX(var(--gsk, 0deg))
		}

		.tagline {
			margin-top: 14px;
			color: var(--muted);
			font-size: 14px;
			letter-spacing: .04em;
		}

		.tagline b {
			color: var(--txt);
			font-weight: 500
		}

		.snd {
			position: absolute;
			top: 0;
			right: 0;
			background: transparent;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--muted);
			font-family: 'Space Grotesk', monospace;
			font-size: 10px;
			letter-spacing: .22em;
			padding: 8px 14px;
			cursor: pointer;
			transition: color .2s, border-color .2s, box-shadow .2s;
		}

		.snd:hover {
			border-color: #3a3a46;
			color: var(--txt)
		}

		.snd:focus-visible {
			outline: 2px solid var(--cyan);
			outline-offset: 2px
		}

		.snd.on {
			color: var(--cyan);
			border-color: rgba(0, 229, 255, .5);
			box-shadow: 0 0 12px -2px rgba(0, 229, 255, .4);
		}

		header {
			position: relative
		}

		/* ---------- sections ---------- */
		section {
			margin-bottom: clamp(26px, 5vw, 38px)
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 12px;
			font-size: 11px;
			letter-spacing: .28em;
			color: var(--muted);
			text-transform: uppercase;
			margin-bottom: 14px;
		}

		.eyebrow::after {
			content: "";
			flex: 1;
			height: 1px;
			background: var(--line)
		}

		/* ---------- cards ---------- */
		.cards {
			display: grid;
			gap: 10px
		}

		@media(min-width:560px) {
			.cards.two {
				grid-template-columns: 1fr 1fr
			}
		}

		.card {
			display: flex;
			align-items: center;
			gap: 14px;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			padding: 12px 14px;
			text-decoration: none;
			color: var(--txt);
			transition: border-color .18s, transform .18s, box-shadow .18s;
		}

		.card:hover,
		.card:focus-visible {
			border-color: #3a3a46;
			transform: translateY(-1px);
			box-shadow: 0 0 0 1px rgba(0, 229, 255, .12), 4px 0 18px -8px rgba(255, 45, 120, .25), -4px 0 18px -8px rgba(0, 229, 255, .25);
		}

		.card:focus-visible {
			outline: 2px solid var(--cyan);
			outline-offset: 2px
		}

		@media (prefers-reduced-motion:reduce) {
			.card {
				transition: none
			}

			.card:hover {
				transform: none
			}
		}

		.thumb {
			width: 56px;
			height: 56px;
			flex: none;
			border-radius: 12px;
			overflow: hidden;
			background: #000;
			display: grid;
			place-items: center;
			border: 1px solid var(--line);
		}

		.thumb img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block
		}

		.thumb.x {
			font-size: 28px;
			font-weight: 700;
			color: #fff;
			font-family: system-ui
		}

		.meta {
			min-width: 0;
			flex: 1
		}

		.meta .name {
			font-weight: 500;
			font-size: 15.5px;
			letter-spacing: .02em
		}

		.meta .desc {
			color: var(--muted);
			font-size: 12.5px;
			margin-top: 2px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-family: 'Zen Kaku Gothic New', sans-serif;
		}

		.arrow {
			flex: none;
			color: var(--muted);
			font-size: 16px;
			transition: transform .18s, color .18s;
		}

		.card:hover .arrow {
			transform: translateX(3px);
			color: var(--cyan)
		}

		/* ---------- footer ---------- */
		footer {
			margin-top: 48px;
			text-align: center;
			color: #55555f;
			font-size: 11px;
			letter-spacing: .2em;
			text-transform: uppercase;
		}
	</style>
</head>

	<script>
		/* ================= 宇宙背景（前進スターフィールド） ================= */
(function(){
  const c = document.getElementById('space');
  const ctx = c.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,stars=[],raf=null;
  const DPR = Math.min(devicePixelRatio||1, 2);

  function resize(){
    W = innerWidth; H = innerHeight;
    c.width = W*DPR; c.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const n = Math.min(200, Math.floor(W*H/9000));
    stars = Array.from({length:n}, newStar);
  }
  function newStar(){
    return {
      x:(Math.random()-0.5)*W,
      y:(Math.random()-0.5)*H,
      z:Math.random()*0.9+0.1,
      hue: Math.random()<0.12 ? 185 : (Math.random()<0.06 ? 330 : 0), // 稀にcyan/magenta
      tw: Math.random()*Math.PI*2
    };
  }
  function frame(t){
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(0,0,W,H);
    const cx=W/2, cy=H/2;
    for(const s of stars){
      s.z -= 0.0016;                       // ゆっくり手前へ
      if(s.z<=0.02){ Object.assign(s,newStar()); s.z=1; }
      const k=1/s.z, px=cx+s.x*k*0.5, py=cy+s.y*k*0.5;
      if(px<-10||px>W+10||py<-10||py>H+10){ Object.assign(s,newStar()); s.z=1; continue; }
      const r=Math.max(0.3,(1-s.z)*1.6);
      const a=(0.35+(1-s.z)*0.55)*(0.8+0.2*Math.sin(t*0.002+s.tw));
      ctx.beginPath();
      ctx.fillStyle = s.hue ? `hsla(${s.hue},90%,70%,${a})` : `rgba(235,240,245,${a})`;
      ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  function drawStatic(){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    for(const s of stars){
      const k=1/s.z, px=W/2+s.x*k*0.5, py=H/2+s.y*k*0.5;
      ctx.beginPath();
      ctx.fillStyle=`rgba(235,240,245,${0.3+(1-s.z)*0.5})`;
      ctx.arc(px,py,Math.max(0.3,(1-s.z)*1.4),0,Math.PI*2);
      ctx.fill();
    }
  }
  addEventListener('resize', ()=>{ resize(); if(reduced) drawStatic(); });
  document.addEventListener('visibilitychange', ()=>{
    if(reduced) return;
    if(document.hidden){ cancelAnimationFrame(raf); raf=null; }
    else if(!raf){ raf=requestAnimationFrame(frame); }
  });
  resize();
  if(reduced){ drawStatic(); } else { raf=requestAnimationFrame(frame); }
})();

/* ================= KURO' グリッチノイズ ================= */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = document.querySelector('.glitch');
  const st = el.style;
  const R = (a,b)=>a+Math.random()*(b-a);
  function slice(){ // 水平スライスのclip-path
    const y1=R(0,80), h=R(4,22);
    return `inset(${y1}% -2% ${Math.max(0,100-y1-h)}% -2%)`;
  }
  function burst(){
    el.classList.add('burst');
    const dur=R(180,420), step=45;
    let elapsed=0;
    const iv=setInterval(()=>{
      st.setProperty('--g1x', R(-7,7)+'px');
      st.setProperty('--g2x', R(-7,7)+'px');
      st.setProperty('--g1y', R(-2,2)+'px');
      st.setProperty('--g2y', R(-2,2)+'px');
      st.setProperty('--g1c', slice());
      st.setProperty('--g2c', slice());
      st.setProperty('--gsk', R(-1.2,1.2)+'deg');
      elapsed+=step;
      if(elapsed>=dur){
        clearInterval(iv);
        el.classList.remove('burst');
        st.setProperty('--g1x','-1.5px'); st.setProperty('--g2x','1.5px');
        st.setProperty('--g1y','0');      st.setProperty('--g2y','0');
        st.setProperty('--g1c','none');   st.setProperty('--g2c','none');
        st.setProperty('--gsk','0deg');
      }
    }, step);
    setTimeout(burst, R(1600,4200));
  }
  setTimeout(burst, 900);
})();

/* ================= BGM: SoyHashSound (BSVブロックハッシュ → 生成音楽) ================= */
class SoundSynthesizer {
      constructor() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.isInitialized = false;
        
        this.baseFreq = 261.63;
        
        this.scale = [
          this.baseFreq,        // C
          this.baseFreq * 9/8,  // D
          this.baseFreq * 5/4,  // E
          this.baseFreq * 3/2,  // G
          this.baseFreq * 5/3,  // A
          this.baseFreq * 2     // C
        ];

        this.melodyPatterns = {
          pattern1: [0, 2, 4, 2, 1, 2, 4, 2],
          pattern2: [0, 1, 2, 4, 4, 2, 1, 0],
          pattern3: [0, 2, 1, 3, 2, 4, 3, 5],
          pattern4: [4, 2, 0, 2, 4, 2, 1, 2],
          pattern5: [5, 3, 1, 0, 2, 4, 5, 3],
          pattern6: [0, 5, 4, 2, 3, 1, 0, 4],
          pattern7: [2, 4, 5, 3, 1, 0, 2, 5],
          pattern8: [1, 3, 0, 4, 2, 5, 1, 3]
        };

        this.chordPresets = {
          major: [1, 5/4, 3/2],
          sus4: [1, 4/3, 3/2],
          major7: [1, 5/4, 3/2, 15/8],
          add9: [1, 5/4, 3/2, 9/4]
        };
      }

      async initialize() {
        if (this.isInitialized) return;
        await this.audioContext.resume();
        this.isInitialized = true;
        await this.createReverb();
      }

      async createReverb() {
        this.reverb = this.audioContext.createConvolver();
        const length = 3;
        const decay = 2.5;
        const sampleRate = this.audioContext.sampleRate;
        const impulse = this.audioContext.createBuffer(2, length * sampleRate, sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
          const impulseData = impulse.getChannelData(channel);
          for (let i = 0; i < impulseData.length; i++) {
            const t = i / sampleRate;
            impulseData[i] = (Math.random() * 2 - 1) * Math.exp(-t * decay);
          }
        }
        
        this.reverb.buffer = impulse;
      }

      generateMelodyFromHash(hash) {
        const usableHash = hash.replace(/^0+/, '');
        const notes = [];
        
        const complexScale = [
          this.baseFreq * 0.5,
          this.baseFreq * 2/3,
          this.baseFreq,
          this.baseFreq * 5/4,
          this.baseFreq * 4/3,
          this.baseFreq * 3/2,
          this.baseFreq * 7/4,
          this.baseFreq * 2,
          this.baseFreq * 2.25,
          this.baseFreq * 1.5,
        ];

        for (let i = 0; i < 8; i++) {
          const hashPart1 = parseInt(usableHash.substr(i * 2, 2), 16);
          const hashPart2 = parseInt(usableHash.substr(usableHash.length - i - 2, 2), 16);
          
          const noteIndex = Math.floor(
            (Math.sin(hashPart1) * Math.cos(hashPart2) + 1) * 
            complexScale.length / 2
          ) % complexScale.length;
          
          notes.push(complexScale[noteIndex]);
        }
        
        return notes;
      }

      startBackgroundSound(hash) {
        if (this.sequencerInterval) {
          clearInterval(this.sequencerInterval);
        }

        const baseFreq = this.baseFreq / 2;
        this.scale.forEach((freq, index) => {
          const delay = index * 0.5;
          setTimeout(() => {
            this.createPadSound(freq / 2, 0.03 / (index + 1));
          }, delay * 1000);
        });

        this.startMelodicSequence(hash);
      }

      createPadSound(frequency, volume) {
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const filter = this.audioContext.createBiquadFilter();
        
        const lfo = this.audioContext.createOscillator();
        const lfoGain = this.audioContext.createGain();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(0.2 + Math.random() * 0.3, this.audioContext.currentTime);
        lfoGain.gain.setValueAtTime(frequency * 0.005, this.audioContext.currentTime);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(frequency * 2, this.audioContext.currentTime);
        filter.Q.setValueAtTime(0.5, this.audioContext.currentTime);
        
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.reverb);
        this.reverb.connect(this.audioContext.destination);
        
        gain.gain.setValueAtTime(0, this.audioContext.currentTime);
        gain.gain.linearRampToValueAtTime(volume, this.audioContext.currentTime + 2);
        
        osc.start();
        lfo.start();

        if (!this.activeOscillators) {
          this.activeOscillators = [];
        }
        if (!this.activeGains) {
          this.activeGains = [];
        }
        this.activeOscillators.push(osc);
        this.activeGains.push(gain);
      }

      startMelodicSequence(hash) {
        let patternIndex = 0;
        let step = 0;
        
        const calculateTempo = (hash) => {
          const usableHash = hash.replace(/^0+/, '');
          console.log('Original hash:', hash);
          console.log('Usable hash after removing leading zeros:', usableHash);
          
          const tempoSeed = parseInt(usableHash.slice(0, 4), 16);
          
          const normalizedSeed = tempoSeed / 0xFFFF;
          const tempoVariation = Math.sin(normalizedSeed * Math.PI) * 20;
          const baseTempo = 120 + tempoVariation;
          
          console.log('Calculated BPM:', baseTempo);
          
          return Math.round(60000 / (baseTempo * 4));
        };
        
        const interval = calculateTempo(hash);
        
        this.sequencerInterval = setInterval(() => {
  const patterns = Object.values(this.melodyPatterns);
  const currentPattern = patterns[patternIndex];
  const noteIndex = currentPattern[step];
  
  const note = this.scale[noteIndex];
  this.playMelodicNote(note);
  
  step = (step + 1) % currentPattern.length;
  if (step === 0) {
    patternIndex = Math.floor(Math.random() * patterns.length);
  }
}, interval);
      }

      playMelodicNote(frequency) {
        const oscillatorTypes = ['sine', 'triangle', 'sawtooth', 'square'];
        const filterTypes = ['bandpass', 'lowpass', 'highpass'];
        
        const oscType = oscillatorTypes[Math.floor(Math.random() * oscillatorTypes.length)];
        const filterType = filterTypes[Math.floor(Math.random() * filterTypes.length)];

        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const filter = this.audioContext.createBiquadFilter();
        
        osc.type = oscType;
        osc.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        
        filter.type = filterType;
        filter.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        filter.Q.setValueAtTime(Math.random() * 10, this.audioContext.currentTime);
        
        const attackTime = 0.05 + Math.random() * 0.1;
        const decayTime = 0.3 + Math.random() * 0.2;
        
        gain.gain.setValueAtTime(0, this.audioContext.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, this.audioContext.currentTime + attackTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + decayTime);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.reverb);
        
        osc.start();
        osc.stop(this.audioContext.currentTime + decayTime);
      }
      
      playBlockUpdateSound(hash) {
        this.initialize();
        
        const melodyNotes = this.generateMelodyFromHash(hash);
        
        if (this.sequencerInterval) {
          clearInterval(this.sequencerInterval);
        }
        this.startBackgroundSound(hash);
        
        melodyNotes.forEach((freq, index) => {
          setTimeout(() => {
            const oscs = [];
            const gains = [];
            
            const harmonics = [1, 1.2, 1.5, 2];
            
            harmonics.forEach((harmonic, i) => {
              const osc = this.audioContext.createOscillator();
              const gain = this.audioContext.createGain();
              
              osc.type = i === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq * harmonic, this.audioContext.currentTime);
              
              const volume = 0.000000000000000000001 / (i + 1);
              gain.gain.setValueAtTime(0, this.audioContext.currentTime);
              gain.gain.linearRampToValueAtTime(volume, this.audioContext.currentTime + 0.05);
              
              gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 1.0);
              
              const filter = this.audioContext.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(freq * 4, this.audioContext.currentTime);
              filter.Q.setValueAtTime(0.5, this.audioContext.currentTime);
              
              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.reverb);
              
              oscs.push(osc);
              gains.push(gain);
              
              const startDelay = i * 0.02;
              osc.start(this.audioContext.currentTime + startDelay);
              osc.stop(this.audioContext.currentTime + 1.2);
            });
            
            this.reverb.connect(this.audioContext.destination);
            
          }, index * 250);
        });
        
        const chordBase = melodyNotes[0];
        const chordType = Object.values(this.chordPresets)[parseInt(hash.substr(-2), 16) % Object.keys(this.chordPresets).length];
        
        chordType.forEach((ratio, index) => {
          const osc = this.audioContext.createOscillator();
          const gain = this.audioContext.createGain();
          const filter = this.audioContext.createBiquadFilter();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(chordBase * ratio, this.audioContext.currentTime);
          
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(chordBase * ratio * 2, this.audioContext.currentTime);
          filter.Q.setValueAtTime(0.5, this.audioContext.currentTime);
          
          gain.gain.setValueAtTime(0, this.audioContext.currentTime);
          gain.gain.linearRampToValueAtTime(0.2 / (index + 1), this.audioContext.currentTime + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 2);
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.reverb);
          
          osc.start();
          osc.stop(this.audioContext.currentTime + 2);
        });
      }
      
      cleanupOldSounds() {
        if (this.activeOscillators) {
          this.activeOscillators.forEach((osc, index) => {
            const gain = this.activeGains[index];
            gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 0.1);
          });
          this.activeOscillators = [];
          this.activeGains = [];
        }
      }
      
      stop() {
        if (this.sequencerInterval) {
          clearInterval(this.sequencerInterval);
        }
        if (this.backgroundOscillators) {
          this.backgroundOscillators.forEach(osc => osc.stop());
          this.backgroundOscillators = [];
          this.backgroundGains = [];
        }
        this.cleanupOldSounds();
        if (this.audioContext) {
          this.audioContext.suspend();
        }
      }

      async resume() {
        if (this.audioContext) {
          await this.audioContext.resume();
        }
      }
    }

(function(){
  const btn = document.getElementById('soundToggle');
  let synth=null, muted=true, lastHeight=null, pollId=null;

  async function latestBlock(){
    const info = await (await fetch('https://api.whatsonchain.com/v1/bsv/main/chain/info')).json();
    const blk  = await (await fetch('https://api.whatsonchain.com/v1/bsv/main/block/height/'+info.blocks)).json();
    return { height: info.blocks, hash: blk.hash };
  }
  async function playLatest(){
    try{
      const b = await latestBlock();
      lastHeight = b.height;
      synth.playBlockUpdateSound(b.hash);
    }catch(e){ console.error('block fetch failed', e); }
  }
  async function poll(){
    if(muted || !synth) return;
    try{
      const info = await (await fetch('https://api.whatsonchain.com/v1/bsv/main/chain/info')).json();
      if(info.blocks !== lastHeight){
        const blk = await (await fetch('https://api.whatsonchain.com/v1/bsv/main/block/height/'+info.blocks)).json();
        lastHeight = info.blocks;
        synth.playBlockUpdateSound(blk.hash);  // 新ブロックで旋律が変わる
      }
    }catch(e){ /* 次のポーリングで再試行 */ }
  }

  btn.addEventListener('click', async ()=>{
    muted = !muted;
    btn.classList.toggle('on', !muted);
    btn.setAttribute('aria-pressed', String(!muted));
    btn.textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
    if(muted){
      if(synth) synth.stop();
      clearInterval(pollId); pollId=null;
    }else{
      if(!synth) synth = new SoundSynthesizer();
      await synth.initialize();
      await synth.resume();
      await playLatest();
      pollId = setInterval(poll, 30000);
    }
  });
})();
